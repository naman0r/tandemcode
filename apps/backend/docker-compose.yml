# Values come from the .env file in this directory (see .env.example).
# ${VAR:?...} makes Compose fail loudly instead of substituting an empty string.
services:
  db:
    # The same major version as production and CI.
    image: postgres:17
    container_name: tandemcode-db
    environment:
      POSTGRES_DB: ${DB_NAME:?missing DB_NAME - copy .env.example to .env}
      POSTGRES_USER: ${DB_USER:?missing DB_USER - copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD - copy .env.example to .env}
    # Loopback only: the database has no business on the LAN.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: tandemcode-backend
    environment:
      # Inside the Compose network the database is "db" on its native port,
      # which is why these two are not taken from .env.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?missing DB_NAME}
      DB_USER: ${DB_USER:?missing DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CLERK_ISSUER: ${CLERK_ISSUER:?missing CLERK_ISSUER}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?missing CLERK_SECRET_KEY}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    ports:
      - "8080:8080"
    # The API applies migrations on start. Anything that reads the schema
    # waits for this rather than racing it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  runner:
    build: .
    container_name: tandemcode-runner
    command: ["python", "-m", "app.runner"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?missing DB_NAME}
      DB_USER: ${DB_USER:?missing DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.11-slim}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    # Each submission runs in its own container with no network, started
    # through the host's Docker socket. That makes this service as trusted as
    # the host, which is why it runs nothing but our own code. It still runs
    # as root: the socket is root-owned on most hosts.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # The built web app behind nginx. Not started by default: development uses
  # the Vite server. `docker compose --profile prod up` brings up everything.
  web:
    build:
      context: ../web
      args:
        # Not required here: a hard requirement would break plain `docker
        # compose up` for development. The web build fails if it is empty.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8080}
    container_name: tandemcode-web
    profiles: ["prod"]
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
    # Postgres cannot open another major version's data files, so the volume
    # is named for the version. An old tandemcode-db-data volume is unused and
    # can be removed with `docker volume rm tandemcode-db-data`.
    name: tandemcode-db-data-17
