# Values come from the .env file in this directory (see .env.example).
# ${VAR:?...} makes Compose fail loudly instead of substituting an empty string.
services:
  db:
    image: postgres:13
    container_name: tandemcode-db
    environment:
      POSTGRES_DB: ${DB_NAME:?missing DB_NAME - copy .env.example to .env}
      POSTGRES_USER: ${DB_USER:?missing DB_USER - copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD - copy .env.example to .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: tandemcode-backend
    environment:
      # Inside the Compose network the database is "db" on its native port,
      # which is why these two are not taken from .env.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?missing DB_NAME}
      DB_USER: ${DB_USER:?missing DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CLERK_ISSUER: ${CLERK_ISSUER:?missing CLERK_ISSUER}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?missing CLERK_SECRET_KEY}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  runner:
    build: .
    container_name: tandemcode-runner
    command: ["python", "-m", "app.runner"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?missing DB_NAME}
      DB_USER: ${DB_USER:?missing DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD}
      CLERK_ISSUER: ${CLERK_ISSUER:?missing CLERK_ISSUER}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?missing CLERK_SECRET_KEY}
    # Submitted code runs as a subprocess of this container. The per-run
    # rlimits in the judge cap one program; these cap the container itself.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

volumes:
  db-data:
    name: tandemcode-db-data
