server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A location with its own add_header drops the server's, so both repeat
    # the security headers. Script and connect sources are left to the deploy,
    # which knows the API and Clerk origins.

    # Hashed assets can be cached forever; index.html must not be, or a
    # deploy leaves browsers asking for bundles that no longer exist.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Content-Security-Policy "frame-ancestors 'none'";
    }

    # Client-side routes such as /rooms/abc are served by the app shell.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Content-Security-Policy "frame-ancestors 'none'";
        try_files $uri /index.html;
    }
}
