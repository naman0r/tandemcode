# Production: API, runner, Postgres and Caddy on one host. The web app is on
# Vercel. Run from the repo root:
#   docker compose -f infra/docker-compose.prod.yml up -d --build
# Values come from infra/.env (see infra/.env.example).

# Docker keeps container logs forever by default, and one box has one disk.
x-logging: &logging
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *logging
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?missing DB_NAME}
      # The superuser, for maintenance only. The app connects as DB_USER,
      # which db-init.sh creates as the database's owner but not a superuser,
      # so no migration or query can reach the server's files or programs.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?missing DB_ADMIN_PASSWORD}
      APP_DB_USER: ${DB_USER:?missing DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD}
    # No ports, and a network with no route out.
    networks: [internal]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *logging
    build: ../apps/backend
    # Behind Caddy, the only way in: trust its X-Forwarded-For so logs show
    # the caller, and cap open connections so a flood cannot exhaust the box.
    # A websocket message is read whole before the app sees it, so the cap is
    # the editor relay's largest frame.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8080
      - --ws-max-size=262144
      - --forwarded-allow-ips=*
      - --limit-concurrency=1000
    networks: [internal, default]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:?missing CORS_ORIGINS}
      CLERK_ISSUER: ${CLERK_ISSUER:?missing CLERK_ISSUER}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?missing CLERK_SECRET_KEY}
      RUN_MIGRATIONS_ON_STARTUP: "true"
    # Whatever goes wrong in the API, it is restarted before it can take
    # Postgres and the runner down with it.
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  runner:
    <<: *logging
    build: ../apps/backend
    # Needs the database and the Docker socket, nothing on the internet.
    networks: [internal]
    command: ["python", "-m", "app.runner"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Pinned by digest: the runner holds the Docker socket, so the image it
      # pulls on every start must not change under it. Bump deliberately.
      SANDBOX_IMAGE: python:3.11-slim@sha256:da047cb8f9d1d98e5c070f5300ba9f7274e33b8fc0e5be5ed88740aed1b95ba9
      # gVisor, installed on the host by infra/install-gvisor.sh.
      SANDBOX_RUNTIME: runsc
    # Starts one judge container per submission through the host's Docker
    # socket, which makes it as trusted as the host; it runs only our code.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    <<: *logging
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?missing API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    internal: true

volumes:
  db-data:
  caddy-data:
  caddy-config:
