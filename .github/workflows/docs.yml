name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Relative links only: a moved or deleted file fails the build, and an
      # outside site being down does not.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path node_modules './**/*.md'
