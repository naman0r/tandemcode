name: Bug report
description: Something in TandemCode does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a room
        2. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - tandemcode.space
        - A local checkout
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Browser, logs, screenshots
      description: Browser and OS, any errors from the browser console, and API or runner logs if you run it locally.
